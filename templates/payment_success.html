{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <!-- Theme: apply immediately to prevent flash of wrong theme -->
    <script>
      (function(){
        var t = localStorage.getItem('fitmaster-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful | FitMaster</title>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="{% static 'images/favicon.svg' %}">
    <link rel="alternate icon" href="{% static 'images/favicon.svg' %}">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/theme_toggle.css' %}?v=5">
    <style>
        body {
            margin: 0;
            background: #0e0e0e;
            background-image: radial-gradient(at 50% 0%, #3a0000 0px, transparent 65%);
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .top-theme-bar {
            position: fixed;
            top: 20px;
            right: 24px;
            z-index: 100;
        }

        .success-box {
            background: #131313;
            border: 1px solid rgba(0, 113, 227, 0.25);
            border-radius: 24px;
            padding: 50px 40px;
            text-align: center;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 35px rgba(0, 113, 227, 0.2);
            animation: fadeIn 0.4s ease;
            transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        @keyframes fadeIn {
            from { transform: scale(0.92); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .check-circle {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #0071e3, #30d158);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: #ffffff;
            margin: 0 auto 20px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 8px;
        }

        p {
            color: #a1a1aa;
            font-size: 13.5px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 22px;
            border-radius: 30px;
            font-family: 'Poppins', sans-serif;
            font-size: 13.5px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #0071e3;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(0, 113, 227, 0.35);
        }

        .btn-primary:hover {
            background: #30d158;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 113, 227, 0.5);
        }

        .btn-secondary {
            background: #141418;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .btn-secondary:hover {
            border-color: #0071e3;
            color: #0071e3;
        }

        /* ── Light Mode Overrides ── */
        [data-theme="light"] body {
            background: #f8fafc !important;
            background-image: none !important;
            color: #0f172a !important;
        }

        [data-theme="light"] .success-box {
            background: #ffffff !important;
            border: 1px solid #e2e8f0 !important;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.07), 0 0 25px rgba(0, 113, 227, 0.08) !important;
        }

        [data-theme="light"] h1 {
            color: #0f172a !important;
        }

        [data-theme="light"] p {
            color: #64748b !important;
        }

        [data-theme="light"] .btn-secondary {
            background: #f1f5f9 !important;
            color: #334155 !important;
            border: 1px solid #cbd5e1 !important;
        }

        [data-theme="light"] .btn-secondary:hover {
            background: #e2e8f0 !important;
            color: #0f172a !important;
            border-color: #94a3b8 !important;
        }
    </style>
</head>
<body>
    <div class="top-theme-bar">
        <button class="theme-toggle-btn" id="navThemeToggle"
                aria-label="Switch to Light Mode"
                title="Switch to Light Mode">
            <span class="theme-toggle-knob">🌙</span>
        </button>
    </div>

    <div class="success-box">
        <div class="check-circle">✓</div>
        <h1>Order Confirmed! 🎉</h1>
        <p>Your payment & membership protocol have been recorded. Your fitness journey with FitMaster continues — welcome aboard!</p>
        <div class="btn-group">
            <a href="{% url 'transactions' %}" class="btn btn-secondary"><i class="fa-solid fa-receipt"></i> View Receipt</a>
            <a href="{% url 'dashboard' %}" class="btn btn-primary"><i class="fa-solid fa-gauge"></i> Go to Dashboard</a>
        </div>
    </div>

    <!-- FitMaster Light/Dark Theme Engine -->
    <script src="{% static 'js/theme_toggle.js' %}"></script>
</body>
</html>
