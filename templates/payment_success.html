{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful | FitMaster</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        body {
            margin: 0;
            background: #0e0e0e;
            background-image: radial-gradient(at 50% 0%, #3a0000 0px, transparent 65%);
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .success-box {
            background: #131313;
            border: 1px solid rgba(255, 85, 64, 0.25);
            border-radius: 24px;
            padding: 50px 40px;
            text-align: center;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 35px rgba(255, 85, 64, 0.2);
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { transform: scale(0.92); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .check-circle {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #ff5540, #ff8a7a);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: #ffffff;
            margin: 0 auto 20px;
            box-shadow: 0 0 35px rgba(255, 85, 64, 0.45);
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 8px;
        }

        p {
            color: #a1a1aa;
            font-size: 13.5px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 22px;
            border-radius: 30px;
            font-family: 'Poppins', sans-serif;
            font-size: 13.5px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #ff5540;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(255, 85, 64, 0.35);
        }

        .btn-primary:hover {
            background: #ff8a7a;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 85, 64, 0.5);
        }

        .btn-secondary {
            background: #141418;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .btn-secondary:hover {
            border-color: #ff5540;
            color: #ff5540;
        }
    </style>
</head>
<body>
    <div class="success-box">
        <div class="check-circle">✓</div>
        <h1>Order Confirmed! 🎉</h1>
        <p>Your payment & membership protocol have been recorded. Your fitness journey with FitMaster continues — welcome aboard!</p>
        <div class="btn-group">
            <a href="{% url 'transactions' %}" class="btn btn-secondary"><i class="fa-solid fa-receipt"></i> View Receipt</a>
            <a href="{% url 'dashboard' %}" class="btn btn-primary"><i class="fa-solid fa-gauge"></i> Go to Dashboard</a>
        </div>
    </div>
</body>
</html>
