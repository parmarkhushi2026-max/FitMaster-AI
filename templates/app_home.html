<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>FitMaster - Home</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-fixed": "#410000",
                        "error-container": "#93000a",
                        "on-error-container": "#d0e8ff",
                        "on-tertiary-fixed-variant": "#234479",
                        "surface": "#0e0e0e",
                        "inverse-surface": "#f9f9f9",
                        "primary-fixed-dim": "#a4d4ff",
                        "surface-dim": "#0e0e0e",
                        "error": "#a4d4ff",
                        "tertiary": "#acc7ff",
                        "on-surface-variant": "#c9c5c4",
                        "on-tertiary-fixed": "#001b3e",
                        "tertiary-fixed": "#d7e3ff",
                        "surface-container": "#131313",
                        "on-primary-fixed-variant": "#930006",
                        "outline": "#938f8e",
                        "outline-variant": "#484545",
                        "inverse-on-surface": "#2b2b2b",
                        "on-secondary-fixed": "#3c0000",
                        "on-tertiary-container": "#002b5c",
                        "surface-container-high": "#181818",
                        "secondary-fixed": "#d0e8ff",
                        "on-surface": "#e2e2e2",
                        "tertiary-container": "#488fff",
                        "secondary": "#a4d4ff",
                        "on-primary-container": "#680003",
                        "surface-variant": "#262626",
                        "surface-tint": "#a4d4ff",
                        "surface-container-highest": "#1e1e1e",
                        "surface-bright": "#222222",
                        "on-secondary-fixed-variant": "#920003",
                        "primary-fixed": "#d0e8ff",
                        "background": "#0e0e0e",
                        "on-tertiary": "#002f65",
                        "inverse-primary": "#c0000c",
                        "primary-container": "#0071e3",
                        "on-background": "#e2e2e2",
                        "primary": "#30d158",
                        "secondary-fixed-dim": "#a4d4ff",
                        "secondary-container": "#670002",
                        "on-secondary": "#680003",
                        "tertiary-fixed-dim": "#acc7ff",
                        "on-error": "#690005",
                        "on-primary": "#690005",
                        "surface-container-lowest": "#000000",
                        "surface-container-low": "#101010",
                        "on-secondary-container": "#d0e8ff"
                    },
                    "fontFamily": {
                        "headline": ["Sora"],
                        "body": ["Sora"],
                        "label": ["Sora"]
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "xs": "0.125rem",
                        "sm": "0.25rem",
                        "md": "0.375rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "3xl": "1.5rem",
                        "full": "9999px"
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
            line-height: 1;
        }
        body {
            font-family: 'Sora', sans-serif;
            background-color: #0e0e0e;
            color: #e2e2e2;
        }
        .glow-effect {
            box-shadow: 0 0 25px -5px rgba(0, 113, 227, 0.4);
        }
        .mesh-bg {
            background-image: radial-gradient(circle at top right, rgba(0, 113, 227, 0.12), transparent 40%),
                              radial-gradient(circle at bottom left, rgba(72, 143, 255, 0.08), transparent 40%);
        }
    </style>
</head>
<body class="min-h-screen bg-background text-on-background selection:bg-primary-container selection:text-white pb-24 md:pb-0 mesh-bg">

<!-- Top Navigation -->
<header class="sticky top-0 z-50 bg-surface/80 backdrop-blur-md border-b border-outline-variant/30 px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-primary-container to-secondary flex items-center justify-center shadow-lg shadow-primary-container/20">
            <span class="material-symbols-outlined text-white text-2xl font-bold">bolt</span>
        </div>
        <span class="text-xl font-extrabold tracking-wider bg-gradient-to-r from-white via-on-surface to-primary bg-clip-text text-transparent">FITMASTER</span>
    </div>
    
    <div class="flex items-center gap-4">
        <a href="{% url 'login' %}" class="px-4 py-2 rounded-lg text-sm font-semibold hover:text-primary transition-colors">Sign In</a>
        <a href="{% url 'signup' %}" class="px-5 py-2.5 rounded-lg text-sm font-bold bg-primary-container hover:bg-primary text-white shadow-lg glow-effect transition-all transform hover:-translate-y-0.5">Get Started</a>
    </div>
</header>

<main class="max-w-7xl mx-auto px-6 py-12">
    <!-- Hero Section -->
    <div class="text-center max-w-3xl mx-auto space-y-6">
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-surface-container-high border border-outline-variant/40 text-xs font-semibold text-primary">
            <span class="w-2 h-2 rounded-full bg-primary"></span>
            Personalized Training & Fitness Studio
        </div>
        <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight">
            Transform Your Body. <br/>
            <span class="bg-gradient-to-r from-primary-container via-secondary to-tertiary bg-clip-text text-transparent">Master Your Fitness.</span>
        </h1>
        <p class="text-on-surface-variant text-base md:text-lg leading-relaxed">
            Personalized workout routines, real-time activity tracking, and custom nutrition plans designed for real results.
        </p>
        <div class="flex items-center justify-center gap-4 pt-4">
            <a href="{% url 'signup' %}" class="px-8 py-3.5 rounded-xl text-base font-bold bg-primary-container hover:bg-primary text-white shadow-xl glow-effect transition-all">Start Free Protocol</a>
            <a href="{% url 'programs' %}" class="px-8 py-3.5 rounded-xl text-base font-semibold bg-surface-container-high hover:bg-surface-variant border border-outline-variant/40 text-white transition-all">Explore Programs</a>
        </div>
    </div>
</main>

</body>
</html>
