version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: fitmaster_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=fitmaster_db
      - POSTGRES_USER=fitmaster_user
      - POSTGRES_PASSWORD=fitmaster_secure_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitmaster_user -d fitmaster_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: fitmaster_web
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn FitMaster.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - SECRET_KEY=django-insecure-prod-key-fitmaster-change-in-production!
      - ALLOWED_HOSTS=localhost,127.0.0.1
      - DATABASE_URL=postgres://fitmaster_user:fitmaster_secure_password@db:5432/fitmaster_db
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  static_volume:
  media_volume:
  logs_volume:
